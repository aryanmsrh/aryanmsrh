<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Aryan Mishra — Quantitative Systems &amp; Applied Mathematics</title>
  <desc id="bannerDesc">Animated minimalist black and white technical banner in JetBrains Mono with live stochastic trajectory drawing and radar telemetry.</desc>
  <defs>
    <!-- Technical Black & White Grid -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="0.75" fill="#FFFFFF" fill-opacity="0.2"/>
    </pattern>

    <style>
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* Blinking status and cursor */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-blink {
        animation: blink 1s infinite;
      }

      /* Live path drawing animation */
      @keyframes tracePath {
        0% { stroke-dashoffset: 450; }
        45%, 85% { stroke-dashoffset: 0; }
        95%, 100% { stroke-dashoffset: 450; }
      }
      .anim-trace {
        stroke-dasharray: 450;
        stroke-dashoffset: 450;
        animation: tracePath 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Scanline sweep across coordinate box */
      @keyframes sweepScan {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 0.8; }
        75% { opacity: 0.8; }
        85%, 100% { transform: translateX(340px); opacity: 0; }
      }
      .anim-scanline {
        animation: sweepScan 8s ease-in-out infinite;
      }

      /* Radar ripple on final S_T node */
      @keyframes ripple {
        0% { r: 3.5px; opacity: 0.9; stroke-width: 1px; }
        50% { r: 10px; opacity: 0; stroke-width: 1.5px; }
        100% { r: 3.5px; opacity: 0; stroke-width: 1px; }
      }
      .anim-ripple {
        animation: ripple 2.5s ease-out infinite;
      }

      /* Alternating Monte Carlo paths opacity */
      @keyframes mcPulse1 {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      @keyframes mcPulse2 {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.08; }
      }
      .anim-mc1 { animation: mcPulse1 4s ease-in-out infinite; }
      .anim-mc2 { animation: mcPulse2 5s ease-in-out infinite; }

      /* Node sequential appearance */
      @keyframes nodeFade1 { 0%, 10% { opacity: 0; } 15%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
      @keyframes nodeFade2 { 0%, 25% { opacity: 0; } 30%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
      @keyframes nodeFade3 { 0%, 40% { opacity: 0; } 45%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
      .anim-n1 { animation: nodeFade1 8s infinite; }
      .anim-n2 { animation: nodeFade2 8s infinite; }
      .anim-n3 { animation: nodeFade3 8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-trace, .anim-scanline, .anim-ripple, .anim-mc1, .anim-mc2, .anim-blink, .anim-n1, .anim-n2, .anim-n3 {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Solid Black Background -->
  <rect width="1200" height="300" fill="#000000"/>
  <!-- Technical Grid Overlay -->
  <rect width="1200" height="300" fill="url(#gridPattern)"/>
  <!-- Outer Minimal Border -->
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#27272A" stroke-width="1"/>

  <!-- Corner Crosshairs / CAD Viewfinders -->
  <g stroke="#71717A" stroke-width="1.2">
    <!-- Top-Left -->
    <path d="M 16 28 L 16 16 L 28 16" fill="none"/>
    <!-- Top-Right -->
    <path d="M 1184 28 L 1184 16 L 1172 16" fill="none"/>
    <!-- Bottom-Left -->
    <path d="M 16 272 L 16 284 L 28 284" fill="none"/>
    <!-- Bottom-Right -->
    <path d="M 1184 272 L 1184 284 L 1172 284" fill="none"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(56, 50)" class="mono">
    <!-- Top Telemetry Tag with Live Blinking Indicator -->
    <g>
      <circle cx="4" cy="-3.5" r="3" fill="#FFFFFF" class="anim-blink"/>
      <text x="16" y="0" fill="#71717A" font-size="11" font-weight="600" letter-spacing="2.5">[ OPERATOR // 2026 ]  ·  SYS_ONLINE</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="46" fill="#FFFFFF" font-size="42" font-weight="700" letter-spacing="3.5">ARYAN MISHRA</text>

    <!-- Domain Focus Line -->
    <text x="0" y="82" fill="#E4E4E7" font-size="13.5" font-weight="500" letter-spacing="1.2">APPLIED MATHEMATICS  //  QUANTITATIVE FINANCE  //  MACHINE LEARNING</text>

    <!-- Methodology Statement -->
    <text x="0" y="110" fill="#A1A1AA" font-size="12" font-weight="400" letter-spacing="0.6">Stochastic Calculus · Vectorized Numerics · Low-Latency Architecture</text>

    <!-- Divider Line -->
    <line x1="0" y1="136" x2="600" y2="136" stroke="#27272A" stroke-width="1"/>
    <line x1="0" y1="136" x2="120" y2="136" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Bottom Status Line with Blinking Cursor -->
    <g transform="translate(0, 164)">
      <text x="0" y="0" fill="#52525B" font-size="10.5" font-weight="500" letter-spacing="1.8">FORMULATE FROM FIRST PRINCIPLES; EXECUTE WITH COMPUTATIONAL RIGOR. </text>
      <rect x="545" y="-9.5" width="6.5" height="11.5" fill="#FFFFFF" class="anim-blink"/>
    </g>
  </g>

  <!-- Right Visual Area: Animated Technical Simulation HUD -->
  <g transform="translate(740, 40)" class="mono">
    <!-- Coordinate Box Frame -->
    <rect width="404" height="220" fill="#000000" fill-opacity="0.7" stroke="#27272A" stroke-width="1"/>
    <rect x="0" y="0" width="404" height="24" fill="#09090B" stroke="#27272A" stroke-width="1"/>
    <text x="14" y="16" fill="#71717A" font-size="10" font-weight="600" letter-spacing="1.5">STOCHASTIC MODEL // GBM (FP64)</text>
    <text x="388" y="16" text-anchor="end" fill="#A1A1AA" font-size="9.5">t ∈ [0, T]</text>

    <!-- Coordinate Grid inside Box -->
    <path d="M 36 190 L 376 190" stroke="#27272A" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M 36 190 L 36 46" stroke="#27272A" stroke-width="1" stroke-dasharray="2 3"/>
    
    <text x="372" y="204" fill="#52525B" font-size="9.5">t</text>
    <text x="20" y="50" fill="#52525B" font-size="9.5">S_t</text>

    <!-- Analytical Expected Value Path (Dashed) -->
    <path d="M 36 148 Q 200 136 376 100" fill="none" stroke="#52525B" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Multiple Background Realizations (Pulsing Opacity) -->
    <path class="anim-mc1" d="M 36 148 L 74 154 L 112 144 L 150 160 L 188 152 L 226 168 L 264 158 L 302 165 L 340 152 L 376 156" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <path class="anim-mc2" d="M 36 148 L 74 138 L 112 146 L 150 132 L 188 140 L 226 122 L 264 130 L 302 115 L 340 120 L 376 108" fill="none" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Vertical Sweeping Scanline -->
    <g transform="translate(36, 46)">
      <line class="anim-scanline" x1="0" y1="0" x2="0" y2="144" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <!-- Primary Stochastic Trajectory (Live Tracing White Line) -->
    <path class="anim-trace" d="M 36 148 L 74 132 L 112 140 L 150 118 L 188 124 L 226 98 L 264 106 L 302 78 L 340 84 L 376 60" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Trajectory Key Nodes (Sequential Appearance) -->
    <circle cx="36" cy="148" r="3" fill="#FFFFFF"/>
    <circle class="anim-n1" cx="150" cy="118" r="2.5" fill="#FFFFFF"/>
    <circle class="anim-n2" cx="264" cy="106" r="2.5" fill="#FFFFFF"/>
    
    <!-- Final Terminal Price Node with Radar Ping Ripple -->
    <g class="anim-n3">
      <circle class="anim-ripple" cx="376" cy="60" r="3.5" fill="none" stroke="#FFFFFF"/>
      <circle cx="376" cy="60" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Inset Telemetry Metric Box -->
    <g transform="translate(50, 60)">
      <rect width="170" height="36" fill="#000000" stroke="#27272A" stroke-width="1"/>
      <text x="10" y="15" fill="#A1A1AA" font-size="9" font-weight="600" letter-spacing="1">dS_t = μ S_t dt + σ S_t dW_t</text>
      <text x="10" y="28" fill="#71717A" font-size="8.5">1,000,000 PATHS · AVX2</text>
    </g>
  </g>
</svg>