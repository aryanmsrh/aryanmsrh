<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Mishra — Quantitative Systems &amp; Applied Mathematics</title>
  <desc id="desc">High-tech minimalist banner with stochastic paths, mathematical coordinate system, and systems engineering telemetry.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="pathGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="1"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="ambientGlow" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-opacity="0.25" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#techGrid)"/>
  <rect width="1200" height="340" rx="16" fill="url(#ambientGlow)"/>

  <!-- Outer Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Left Header Status Pill -->
  <g transform="translate(56, 44)">
    <rect width="320" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <circle cx="14" cy="13" r="7" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="17" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.5">SYS_ONLINE // FP64_RIGOR</text>
    <path d="M210 7 L210 19" stroke="#334155" stroke-width="1"/>
    <text x="222" y="17" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">C++ · PYTHON</text>
  </g>

  <!-- Main Name Header -->
  <text x="54" y="128" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="46" font-weight="800" letter-spacing="3">ARYAN MISHRA</text>
  
  <!-- Accent Line -->
  <path d="M56 148 L460 148" stroke="url(#cyanAmber)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Role Subtitles -->
  <text x="56" y="184" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.2">MATHEMATICS × QUANTITATIVE FINANCE × MACHINE LEARNING</text>
  
  <text x="56" y="214" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" letter-spacing="0.5">Stochastic Calculus · Low-Latency Primitives · High-Performance Numerics</text>

  <!-- Terminal Command Prompt Box -->
  <g transform="translate(56, 246)">
    <rect width="480" height="38" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="24" fill="#10B981" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="12" font-weight="700">&gt;</text>
    <text x="34" y="24" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="12" font-weight="500">model.converge(target="first_principles", lr=0.001)</text>
    <rect x="424" y="13" width="7" height="13" fill="#38BDF8" fill-opacity="0.8"/>
  </g>

  <!-- Right Visual Area: Coordinate Field & Stochastic Simulation Graph -->
  <g transform="translate(680, 36)">
    <!-- Coordinate Field Boundary -->
    <rect width="464" height="268" rx="12" fill="#080C14" stroke="#1E293B" stroke-width="1"/>

    <!-- Field Header -->
    <g transform="translate(18, 22)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">SIMULATION HUD // GEOMETRIC BROWNIAN MOTION</text>
      <text x="350" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" font-weight="700">t ∈ [0, T]</text>
    </g>

    <!-- Axes -->
    <path d="M 28 234 L 436 234" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M 28 234 L 28 44" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Axis Labels -->
    <text x="428" y="248" fill="#475569" font-family="ui-monospace, monospace" font-size="10">t</text>
    <text x="14" y="48" fill="#475569" font-family="ui-monospace, monospace" font-size="10">S_t</text>

    <!-- Background Simulated Paths (Stochastic Realizations) -->
    <path d="M 28 170 L 68 162 L 108 178 L 148 152 L 188 165 L 228 140 L 268 148 L 308 128 L 348 135 L 388 110 L 428 95" fill="none" stroke="#334155" stroke-opacity="0.45" stroke-width="1.2"/>
    
    <path d="M 28 170 L 68 180 L 108 172 L 148 188 L 188 175 L 228 190 L 268 178 L 308 185 L 348 172 L 388 182 L 428 176" fill="none" stroke="#334155" stroke-opacity="0.3" stroke-width="1.2"/>

    <path d="M 28 170 L 68 155 L 108 142 L 148 148 L 188 130 L 228 138 L 268 112 L 308 122 L 348 98 L 388 84 L 428 62" fill="none" stroke="#60A5FA" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Primary Trajectory (Mean Reverting / High Sharpe Path) -->
    <path d="M 28 170 L 68 148 L 108 160 L 148 132 L 188 144 L 228 108 L 268 122 L 308 86 L 348 96 L 388 64 L 428 42" fill="none" stroke="url(#pathGradient)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Highlight Nodes -->
    <circle cx="28" cy="170" r="4" fill="#38BDF8"/>
    <circle cx="148" cy="132" r="3" fill="#60A5FA"/>
    <circle cx="268" cy="122" r="3.5" fill="#818CF8"/>
    <circle cx="428" cy="42" r="4.5" fill="#F59E0B" filter="url(#softGlow)"/>

    <!-- Mathematical Formula Overlay Badge -->
    <g transform="translate(42, 54)">
      <rect width="180" height="42" rx="6" fill="#0B111E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">dS_t = μS_t dt + σS_t dW_t</text>
      <text x="12" y="33" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5">∇_θ L(θ) → 0  [Optimality]</text>
    </g>

    <!-- Quantitative Metrics Inset -->
    <g transform="translate(242, 178)">
      <rect width="180" height="44" rx="6" fill="#090E17" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#64748B" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="1">SIMULATION ENGINE</text>
      <text x="12" y="34" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">10^6 Paths · Vectorized</text>
    </g>
  </g>
</svg>
