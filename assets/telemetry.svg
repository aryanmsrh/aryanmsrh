<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Mishra — Quantitative &amp; Model Telemetry</title>
  <desc id="desc">Four high-tech performance telemetry cards showing accuracy, model parameter capacity, canvas frame rate, and target latency budget.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <!-- Accent Lines -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-opacity="0.4" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="1200" height="210" rx="16" fill="#05070B"/>
  <rect width="1200" height="210" rx="16" fill="url(#cardGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="208.5" rx="15.25" fill="none" stroke="#1E293B" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Top Telemetry Header -->
  <path d="M 32 38 L 180 38 M 1020 38 L 1168 38" stroke="url(#headerGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="198" y="42" fill="#64748B" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2.5">CORE BENCHMARKS // EMPIRICAL EVIDENCE &amp; NUMERICAL TARGETS</text>

  <!-- Card 1: Accuracy (Amber) -->
  <g transform="translate(32, 64)">
    <rect width="268" height="120" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect width="4" height="120" rx="2" fill="#F59E0B"/>
    <text x="22" y="44" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="34" font-weight="800" letter-spacing="-0.5">97.2%</text>
    <text x="22" y="72" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">MNIST VALIDATION</text>
    <text x="22" y="94" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5">Pure NumPy from scratch</text>
    <circle cx="242" cy="24" r="3" fill="#F59E0B" fill-opacity="0.6"/>
  </g>

  <!-- Card 2: Parameters (Cyan) -->
  <g transform="translate(322, 64)">
    <rect width="268" height="120" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect width="4" height="120" rx="2" fill="#38BDF8"/>
    <text x="22" y="44" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="34" font-weight="800" letter-spacing="-0.5">109.4K</text>
    <text x="22" y="72" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">MODEL WEIGHTS</text>
    <text x="22" y="94" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5">784 → 128 → 64 → 10 backprop</text>
    <circle cx="242" cy="24" r="3" fill="#38BDF8" fill-opacity="0.6"/>
  </g>

  <!-- Card 3: Canvas Framerate (Violet) -->
  <g transform="translate(612, 64)">
    <rect width="268" height="120" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect width="4" height="120" rx="2" fill="#A855F7"/>
    <text x="22" y="44" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="34" font-weight="800" letter-spacing="-0.5">60 FPS</text>
    <text x="22" y="72" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">INTERACTIVE CANVAS</text>
    <text x="22" y="94" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5">Zero-dep linear algebra engine</text>
    <circle cx="242" cy="24" r="3" fill="#A855F7" fill-opacity="0.6"/>
  </g>

  <!-- Card 4: Target Latency (Emerald) -->
  <g transform="translate(902, 64)">
    <rect width="266" height="120" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect width="4" height="120" rx="2" fill="#10B981"/>
    <text x="22" y="44" fill="#34D399" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="34" font-weight="800" letter-spacing="-0.5">&lt; 10 µs</text>
    <text x="22" y="72" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">LATENCY BUDGET</text>
    <text x="22" y="94" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5">Fast I/O &amp; C++ SIMD targets</text>
    <circle cx="240" cy="24" r="3" fill="#10B981" fill-opacity="0.6"/>
  </g>
</svg>
