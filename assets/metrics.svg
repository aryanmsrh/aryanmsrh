<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Documented project benchmarks</title>
  <desc id="desc">Four build log cards: three selected public projects, 97 percent plus MNIST test accuracy, 109 thousand model parameters, and 60 FPS canvas rendering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" rx="20" fill="url(#bg)"/>
  <path d="M28 42H177 M1023 42H1172" stroke="url(#accent)" stroke-width="2"/>
  <text x="190" y="46" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">BUILD LOG / DOCUMENTED BENCHMARKS</text>

  <g transform="translate(28 70)">
    <rect width="268" height="112" rx="14" fill="#151C2B" stroke="#F5B942" stroke-opacity=".45"/>
    <rect width="5" height="112" rx="2.5" fill="#F5B942"/>
    <text x="25" y="46" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="800">03</text>
    <text x="25" y="74" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">SELECTED PROJECTS</text>
    <text x="25" y="94" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">math · ML · algorithms</text>
  </g>

  <g transform="translate(318 70)">
    <rect width="268" height="112" rx="14" fill="#151C2B" stroke="#C084FC" stroke-opacity=".5"/>
    <rect width="5" height="112" rx="2.5" fill="#C084FC"/>
    <text x="25" y="46" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="800">97%+</text>
    <text x="25" y="74" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">MNIST TEST ACCURACY</text>
    <text x="25" y="94" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">pure NumPy neural engine</text>
  </g>

  <g transform="translate(608 70)">
    <rect width="268" height="112" rx="14" fill="#151C2B" stroke="#7C3AED" stroke-opacity=".55"/>
    <rect width="5" height="112" rx="2.5" fill="#7C3AED"/>
    <text x="25" y="46" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="800">109K</text>
    <text x="25" y="74" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">MODEL PARAMETERS</text>
    <text x="25" y="94" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">784 → 128 → 64 → 10</text>
  </g>

  <g transform="translate(898 70)">
    <rect width="274" height="112" rx="14" fill="#151C2B" stroke="#F5B942" stroke-opacity=".35"/>
    <rect width="5" height="112" rx="2.5" fill="url(#accent)"/>
    <text x="25" y="46" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="800">60 FPS</text>
    <text x="25" y="74" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">MATH CANVAS</text>
    <text x="25" y="94" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">zero-dependency portfolio</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="208.5" rx="19.25" fill="none" stroke="#C9D1D9" stroke-opacity=".15" stroke-width="1.5"/>
