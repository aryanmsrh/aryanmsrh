<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 168" width="100%" max-width="540" height="auto" role="img" aria-labelledby="spotifyTitle spotifyDesc">
  <title id="spotifyTitle">Spotify — I Was Never There by The Weeknd</title>
  <desc id="spotifyDesc">Music card displaying I Was Never There by The Weeknd and Gesaffelstein with official album art and animated equalizer on pure black background.</desc>
  <defs>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>

    <!-- Artwork Clip Path -->
    <clipPath id="artworkClip">
      <rect width="128" height="128" rx="10" ry="10"/>
    </clipPath>

    <!-- Equalizer Animation -->
    <style>
      @keyframes eq1 { 0%, 100% { height: 5px; y: 23px; } 50% { height: 19px; y: 9px; } }
      @keyframes eq2 { 0%, 100% { height: 18px; y: 10px; } 50% { height: 6px; y: 22px; } }
      @keyframes eq3 { 0%, 100% { height: 9px; y: 19px; } 50% { height: 22px; y: 6px; } }
      @keyframes eq4 { 0%, 100% { height: 20px; y: 8px; } 50% { height: 8px; y: 20px; } }
      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Box: Fully Black -->
  <rect width="540" height="168" rx="16" fill="#000000"/>
  <rect x="0.75" y="0.75" width="538.5" height="166.5" rx="15.25" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Album Artwork (Official My Dear Melancholy, cover) -->
  <g transform="translate(20, 20)">
    <image href="data:image/jpeg;base64," width="128" height="128" clip-path="url(#artworkClip)" preserveAspectRatio="xMidYMid slice"/>
    <rect width="128" height="128" rx="10" fill="none" stroke="#27272A" stroke-width="1.2"/>
  </g>

  <!-- Header: Spotify Status + Animated Equalizer -->
  <g transform="translate(168, 22)">
    <!-- Official Spotify Logo (Simple Icons clean path) -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1DB954">
      <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
    <text x="24" y="13" fill="#1DB954" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">NOW PLAYING // SPOTIFY</text>

    <!-- Equalizer Bars -->
    <g transform="translate(306, -6)">
      <rect class="bar1" x="0" y="23" width="3.5" height="5" rx="1.75" fill="#1DB954"/>
      <rect class="bar2" x="6" y="10" width="3.5" height="18" rx="1.75" fill="#1DB954"/>
      <rect class="bar3" x="12" y="19" width="3.5" height="9" rx="1.75" fill="#1DB954"/>
      <rect class="bar4" x="18" y="8" width="3.5" height="20" rx="1.75" fill="#1DB954"/>
    </g>
  </g>

  <!-- Track Info -->
  <!-- Song Title -->
  <text x="168" y="66" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">I Was Never There</text>

  <!-- Artist -->
  <text x="168" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">The Weeknd, Gesaffelstein</text>

  <!-- Playback Progress Bar -->
  <g transform="translate(168, 108)">
    <!-- Rail -->
    <rect width="340" height="4" rx="2" fill="#18181B"/>
    <!-- Played progress (42%) -->
    <rect width="144" height="4" rx="2" fill="url(#progressGrad)"/>
    <!-- Scrubber Knob -->
    <circle cx="144" cy="2" r="5" fill="#FFFFFF"/>
    <!-- Timestamps -->
    <text x="0" y="18" fill="#71717A" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">01:42</text>
    <text x="312" y="18" fill="#71717A" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">04:01</text>
  </g>

  <!-- Player Controls (Minimalist SVGs) -->
  <g transform="translate(290, 138)" fill="#A1A1AA">
    <!-- Shuffle -->
    <path d="M-55 5 L-47 -1 L-47 2 L-42 2 L-37 7 L-39 9 L-43 5 L-47 5 L-47 8 Z" fill="#52525B"/>
    <!-- Previous -->
    <path d="M -26 2 L -26 10 M -26 6 L -17 1 L -17 11 Z" stroke="#A1A1AA" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Play/Pause Pill Button -->
    <circle cx="0" cy="6" r="11" fill="#FFFFFF"/>
    <path d="M -2 2 L -2 10 M 2 2 L 2 10" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <!-- Next -->
    <path d="M 26 2 L 26 10 M 26 6 L 17 1 L 17 11 Z" stroke="#A1A1AA" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Repeat -->
    <path d="M 44 2 A 6 6 0 1 1 40 10 L 40 8" stroke="#52525B" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>
</svg>