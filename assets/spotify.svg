<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 168" width="100%" max-width="540" height="auto" role="img" aria-labelledby="spotifyTitle spotifyDesc">
  <title id="spotifyTitle">Spotify — I Was Never There by The Weeknd</title>
  <desc id="spotifyDesc">Spotify music card displaying I Was Never There by The Weeknd and Gesaffelstein with animated equalizer bars and playback progress.</desc>
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="60%" stop-color="#090C14"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <linearGradient id="albumGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="40%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#180B05"/>
    </linearGradient>

    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>

    <!-- Equalizer Animation -->
    <style>
      @keyframes eq1 { 0%, 100% { height: 5px; y: 23px; } 50% { height: 19px; y: 9px; } }
      @keyframes eq2 { 0%, 100% { height: 18px; y: 10px; } 50% { height: 6px; y: 22px; } }
      @keyframes eq3 { 0%, 100% { height: 9px; y: 19px; } 50% { height: 22px; y: 6px; } }
      @keyframes eq4 { 0%, 100% { height: 20px; y: 8px; } 50% { height: 8px; y: 20px; } }
      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="540" height="168" rx="16" fill="url(#cardGrad)"/>
  <rect x="0.75" y="0.75" width="538.5" height="166.5" rx="15.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Album Artwork (My Dear Melancholy aesthetic) -->
  <g transform="translate(20, 20)">
    <rect width="128" height="128" rx="10" fill="url(#albumGrad)"/>
    <!-- Stylized Silhouette Portrait -->
    <circle cx="64" cy="54" r="26" fill="#0C0705" fill-opacity="0.9"/>
    <path d="M 28 128 C 32 88 44 80 64 80 C 84 80 96 88 100 128 Z" fill="#0C0705" fill-opacity="0.95"/>
    <circle cx="64" cy="48" r="16" fill="#F97316" fill-opacity="0.15"/>
    <!-- Album Title Text in Artwork -->
    <text x="12" y="118" fill="#FDBA74" fill-opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">MY DEAR MELANCHOLY,</text>
    <rect width="128" height="128" rx="10" fill="none" stroke="#F97316" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Header: Spotify Status + Animated Equalizer -->
  <g transform="translate(168, 22)">
    <!-- Spotify Logo -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1DB954">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.497 17.306c-.216.353-.674.464-1.027.25-2.82-1.722-6.37-2.112-10.55-1.157-.402.091-.804-.158-.895-.561-.092-.403.159-.804.561-.896 4.582-1.047 8.513-.598 11.66 1.336.354.214.464.673.251 1.028zm1.47-3.26c-.272.441-.849.58-1.29.308-3.23-1.986-8.15-2.56-11.97-1.4-1.498.151-.497-.37-.346-.869.15-.497.87-.79 1.368-.64 4.36 1.324 9.78 1.968 13.48-.308.441-.272 1.018-.133 1.29.309zm.126-3.393c-3.87-2.3-10.26-2.513-13.97-1.386-.593.18-1.222-.158-1.403-.75-.18-.593.158-1.222.75-1.403 4.27-1.297 11.31-1.046 15.77 1.603.533.316.708 1.01.392 1.543-.317.533-1.011.708-1.539.393z"/>
    </svg>
    <text x="24" y="13" fill="#1DB954" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">ON REPEAT // SPOTIFY</text>

    <!-- Equalizer Bars -->
    <g transform="translate(306, -6)">
      <rect class="bar1" x="0" y="23" width="3.5" height="5" rx="1.75" fill="#1DB954"/>
      <rect class="bar2" x="6" y="10" width="3.5" height="18" rx="1.75" fill="#1DB954"/>
      <rect class="bar3" x="12" y="19" width="3.5" height="9" rx="1.75" fill="#1DB954"/>
      <rect class="bar4" x="18" y="8" width="3.5" height="20" rx="1.75" fill="#1DB954"/>
    </g>
  </g>

  <!-- Track Info -->
  <!-- Song Title -->
  <text x="168" y="66" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">I Was Never There</text>

  <!-- Artist -->
  <text x="168" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">The Weeknd, Gesaffelstein</text>

  <!-- Playback Progress Bar -->
  <g transform="translate(168, 108)">
    <!-- Rail -->
    <rect width="340" height="4" rx="2" fill="#1E293B"/>
    <!-- Played progress (42%) -->
    <rect width="144" height="4" rx="2" fill="url(#progressGrad)"/>
    <!-- Scrubber Knob -->
    <circle cx="144" cy="2" r="5" fill="#FFFFFF"/>
    <!-- Timestamps -->
    <text x="0" y="18" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">01:42</text>
    <text x="312" y="18" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">04:01</text>
  </g>

  <!-- Player Controls (Minimalist SVGs) -->
  <g transform="translate(290, 138)" fill="#94A3B8">
    <!-- Shuffle -->
    <path d="M-55 5 L-47 -1 L-47 2 L-42 2 L-37 7 L-39 9 L-43 5 L-47 5 L-47 8 Z" fill="#64748B"/>
    <!-- Previous -->
    <path d="M -26 2 L -26 10 M -26 6 L -17 1 L -17 11 Z" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Play/Pause Pill Button -->
    <circle cx="0" cy="6" r="11" fill="#F8FAFC"/>
    <path d="M -2 2 L -2 10 M 2 2 L 2 10" stroke="#090C14" stroke-width="2" stroke-linecap="round"/>
    <!-- Next -->
    <path d="M 26 2 L 26 10 M 26 6 L 17 1 L 17 11 Z" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Repeat -->
    <path d="M 44 2 A 6 6 0 1 1 40 10 L 40 8" stroke="#64748B" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
