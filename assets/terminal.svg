<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="auto" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Terminal — Aryan Mishra Quant &amp; Systems Simulation</title>
  <desc id="termDesc">Animated terminal simulating 1,000,000 Geometric Brownian Motion paths with C++20 vectorized engine and risk metrics telemetry.</desc>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C101A"/>
      <stop offset="100%" stop-color="#06080E"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <style>
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 0.9s infinite;
      }

      /* Sequential line appearance */
      @keyframes lineFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes l1 { 0%, 100% { opacity: 1; } }
      @keyframes l2 { 0%, 8% { opacity: 0; } 12%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l3 { 0%, 18% { opacity: 0; } 22%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l4 { 0%, 30% { opacity: 0; } 34%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l5 { 0%, 42% { opacity: 0; } 46%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l6 { 0%, 54% { opacity: 0; } 58%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l7 { 0%, 66% { opacity: 0; } 70%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l8 { 0%, 78% { opacity: 0; } 82%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }

      .anim-l2 { animation: l2 12s infinite; }
      .anim-l3 { animation: l3 12s infinite; }
      .anim-l4 { animation: l4 12s infinite; }
      .anim-l5 { animation: l5 12s infinite; }
      .anim-l6 { animation: l6 12s infinite; }
      .anim-l7 { animation: l7 12s infinite; }
      .anim-l8 { animation: l8 12s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-l2, .anim-l3, .anim-l4, .anim-l5, .anim-l6, .anim-l7, .anim-l8 {
          animation: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="1000" height="340" rx="12" fill="url(#termBg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="338.5" rx="11.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Header / Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 988 0 C 994.627 0 1000 5.373 1000 12 L 1000 38 L 0 38 Z" fill="url(#headerGrad)"/>
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Buttons -->
  <g transform="translate(18, 14)">
    <circle cx="0" cy="5" r="5.5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="18" cy="5" r="5.5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="36" cy="5" r="5.5" fill="#10B981" fill-opacity="0.85"/>
  </g>

  <!-- Title Center -->
  <text x="500" y="23" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.8">aryan@workstation: ~/dev/quant-research</text>

  <!-- Status Right -->
  <g transform="translate(965, 23)">
    <text x="0" y="0" text-anchor="end" fill="#475569" class="font-mono" font-size="10.5">C++20 · AVX2 · 64-bit</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(26, 70)" class="font-mono" font-size="13">

    <!-- Line 1: Command Prompt & Execution -->
    <g>
      <text x="0" y="0">
        <tspan fill="#10B981" font-weight="700">aryan@workstation</tspan>
        <tspan fill="#64748B">:</tspan>
        <tspan fill="#38BDF8">~/dev</tspan>
        <tspan fill="#F8FAFC">$ </tspan>
        <tspan fill="#F59E0B" font-weight="600">./simulate_engine </tspan>
        <tspan fill="#818CF8">--model </tspan>
        <tspan fill="#E2E8F0">gbm </tspan>
        <tspan fill="#818CF8">--paths </tspan>
        <tspan fill="#38BDF8">1000000 </tspan>
        <tspan fill="#818CF8">--precision </tspan>
        <tspan fill="#34D399">fp64</tspan>
      </text>
    </g>

    <!-- Line 2: Compilation / JIT -->
    <g class="anim-l2" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan fill="#10B981" font-weight="700">[✓]</tspan>
        <tspan fill="#94A3B8"> JIT-compiling C++20 vectorized kernel (Clang -O3 -mavx2)... </tspan>
        <tspan fill="#38BDF8">ready</tspan>
        <tspan fill="#64748B"> [14ms]</tspan>
      </text>
    </g>

    <!-- Line 3: Mathematical Formulation -->
    <g class="anim-l3" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan fill="#38BDF8" font-weight="700">[i]</tspan>
        <tspan fill="#94A3B8"> SDE: </tspan>
        <tspan fill="#F59E0B">dS_t = μ S_t dt + σ S_t dW_t</tspan>
        <tspan fill="#64748B">  │  </tspan>
        <tspan fill="#94A3B8">S₀=</tspan><tspan fill="#E2E8F0">100.00</tspan>
        <tspan fill="#94A3B8">  μ=</tspan><tspan fill="#E2E8F0">0.082</tspan>
        <tspan fill="#94A3B8">  σ=</tspan><tspan fill="#E2E8F0">0.185</tspan>
        <tspan fill="#94A3B8">  dt=</tspan><tspan fill="#E2E8F0">1/252</tspan>
      </text>
    </g>

    <!-- Line 4: Path Simulation Execution -->
    <g class="anim-l4" transform="translate(0, 84)">
      <text x="0" y="0">
        <tspan fill="#10B981" font-weight="700">[✓]</tspan>
        <tspan fill="#94A3B8"> Generated </tspan>
        <tspan fill="#38BDF8" font-weight="600">1,000,000</tspan>
        <tspan fill="#94A3B8"> paths in </tspan>
        <tspan fill="#34D399" font-weight="600">1.42ms</tspan>
        <tspan fill="#64748B">  │  Throughput: </tspan>
        <tspan fill="#F59E0B">7.04×10⁸ paths/sec</tspan>
      </text>
    </g>

    <!-- Line 5: Convergence Telemetry -->
    <g class="anim-l5" transform="translate(0, 112)">
      <text x="0" y="0">
        <tspan fill="#F59E0B" font-weight="700">[+]</tspan>
        <tspan fill="#94A3B8"> Monte Carlo E[S_T]: </tspan>
        <tspan fill="#F8FAFC" font-weight="600">108.548 ± 0.012</tspan>
        <tspan fill="#64748B">  │  Analytical: </tspan>
        <tspan fill="#38BDF8">108.551</tspan>
        <tspan fill="#10B981"> (Δ = 0.003)</tspan>
      </text>
    </g>

    <!-- Line 6: Risk Metrics -->
    <g class="anim-l6" transform="translate(0, 140)">
      <text x="0" y="0">
        <tspan fill="#F59E0B" font-weight="700">[+]</tspan>
        <tspan fill="#94A3B8"> Value-at-Risk (99.0%): </tspan>
        <tspan fill="#EF4444" font-weight="600">-14.28%</tspan>
        <tspan fill="#64748B">  │  Expected Shortfall (CVaR): </tspan>
        <tspan fill="#EF4444" font-weight="600">-17.92%</tspan>
      </text>
    </g>

    <!-- Line 7: Optimization Criterion & Status -->
    <g class="anim-l7" transform="translate(0, 168)">
      <text x="0" y="0">
        <tspan fill="#10B981" font-weight="700">[✓]</tspan>
        <tspan fill="#94A3B8"> First-principles criterion satisfied: </tspan>
        <tspan fill="#E2E8F0">||∇L(θ)|| &lt; 1e-7</tspan>
        <tspan fill="#64748B">  │  Status: </tspan>
        <tspan fill="#10B981" font-weight="700">OPTIMAL</tspan>
      </text>
    </g>

    <!-- Line 8: Return Prompt with Cursor -->
    <g class="anim-l8" transform="translate(0, 202)">
      <text x="0" y="0">
        <tspan fill="#10B981" font-weight="700">aryan@workstation</tspan>
        <tspan fill="#64748B">:</tspan>
        <tspan fill="#38BDF8">~/dev</tspan>
        <tspan fill="#F8FAFC">$ </tspan>
        <tspan fill="#38BDF8" class="cursor-blink">█</tspan>
      </text>
    </g>

  </g>
</svg>