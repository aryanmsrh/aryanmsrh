<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Mishra — Mathematics and Computer Science</title>
  <desc id="desc">A midnight computational notebook cover with a graph-paper field, a linear transformation, and a wave curve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="52%" stop-color="#101326"/>
      <stop offset="100%" stop-color="#171126"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="75%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".34"/>
      <stop offset="54%" stop-color="#7C3AED" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="48%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#C9D1D9" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#background)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="22" fill="url(#violetGlow)"/>
  <path d="M0 286 C190 252 310 313 516 281 C735 247 874 160 1200 204 L1200 340 L0 340Z" fill="#7C3AED" fill-opacity=".055"/>
  <path d="M0 287 C190 253 310 314 516 282 C735 248 874 161 1200 205" fill="none" stroke="#7C3AED" stroke-opacity=".42" stroke-width="1.25"/>

  <g opacity=".78">
    <circle cx="62" cy="55" r="4" fill="#F5B942"/>
    <path d="M76 55H128" stroke="#F5B942" stroke-opacity=".55" stroke-width="1"/>
    <text x="140" y="59" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">COMPUTATIONAL NOTEBOOK</text>
  </g>

  <text x="58" y="142" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="52" font-weight="800" letter-spacing="1">ARYAN</text>
  <text x="58" y="196" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="38" font-weight="500" letter-spacing="7">MISHRA</text>
  <path d="M60 220H350" stroke="#F5B942" stroke-width="2"/>
  <text x="58" y="255" fill="#C9D1D9" fill-opacity=".92" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing=".4">mathematics × computer science</text>
  <text x="58" y="285" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">FIRST PRINCIPLES → WORKING SYSTEMS</text>

  <g transform="translate(690 40)">
    <text x="0" y="20" fill="#8B95A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.8">LIVE COORDINATE FIELD</text>
    <g transform="translate(0 34)">
      <path d="M21 218V4 M0 198H374" stroke="#C9D1D9" stroke-opacity=".32" stroke-width="1"/>
      <path d="M22 197L54 87L110 148L168 44L232 127L286 75L352 157" fill="none" stroke="url(#wave)" stroke-width="3" filter="url(#glow)"/>
      <path d="M22 197L132 84L250 62L352 21" fill="none" stroke="#F5B942" stroke-opacity=".86" stroke-width="1.5" stroke-dasharray="4 6"/>
      <path d="M22 197L98 142L199 180L352 157" fill="none" stroke="#C084FC" stroke-opacity=".8" stroke-width="1.5"/>
      <circle cx="22" cy="197" r="5" fill="#F5B942"/>
      <circle cx="132" cy="84" r="4" fill="#F5B942"/>
      <circle cx="250" cy="62" r="4" fill="#C084FC"/>
      <circle cx="352" cy="21" r="4" fill="#C084FC"/>
      <circle cx="98" cy="142" r="4" fill="#7C3AED"/>
      <circle cx="199" cy="180" r="4" fill="#7C3AED"/>
      <circle cx="352" cy="157" r="4" fill="#7C3AED"/>

      <g transform="translate(245 95)" fill="none" stroke="#C9D1D9" stroke-opacity=".7" stroke-width="1.4">
        <path d="M15 0H5V58H15 M93 0H103V58H93"/>
      </g>
      <text x="264" y="116" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">a  b</text>
      <text x="264" y="139" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">c  d</text>
      <text x="244" y="176" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing=".8">TRANSFORM</text>
    </g>
  </g>

  <g opacity=".55">
    <text x="567" y="95" fill="#F5B942" font-family="Georgia, serif" font-size="62">∑</text>
    <text x="605" y="276" fill="#C084FC" font-family="Georgia, serif" font-size="42">∫</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="21.25" fill="none" stroke="#C9D1D9" stroke-opacity=".15" stroke-width="1.5"/>
</svg>
